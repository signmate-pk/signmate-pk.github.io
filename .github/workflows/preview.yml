# Checks and a preview build for work that is not on main yet (master-v3.md section 3).
# Runs on every push to a v3/... or v4/... branch, on every pull request into main, or by hand (Actions tab >
# "Preview build and checks" > Run workflow). It NEVER publishes the live website: only website.yml
# does that, on main.
#
# What you get (Actions tab > the run > Artifacts, at the bottom of the summary page):
#   site-preview         the website as GitHub Pages would serve it; unzip and open with any local web server
#   shared-copy          SignMate-shared-copy.zip: unzip on Windows and double-click "Start SignMate.bat"
#   check-results        every test's output, the ASL browser self-test and the baseline comparison
name: Preview build and checks

on:
  push:
    branches: ["v3/**", "v4/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push and its pull request share the group, so the older run is cancelled.
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Test, compare with the baseline, build the preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system libraries for MediaPipe
        continue-on-error: true
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends libegl1 libgles2 && exit 0
            echo "apt attempt $attempt failed; waiting"; sleep 20
          done
          exit 1

      - name: Install Python packages
        run: python -m pip install -r requirements.txt pandas

      - name: Download the pinned model files (size and SHA-256 checked)
        run: python tools/fetch_assets.py

      - name: Install website packages and Chromium
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      # The frozen Inference Baseline v1: its runtimes and models come from the same pinned versions
      # (models/ and web/node_modules); every file is checked against baseline/manifest.json.
      - name: Restore the Inference Baseline v1 files
        run: python tools/baseline_v1.py restore --from-sources

      - name: Run every test suite (baseline comparison required)
        id: tests
        continue-on-error: true
        env:
          BASELINE_REQUIRED: "1"
        run: |
          mkdir -p ci-results
          python tools/run_all_tests.py 2>&1 | tee ci-results/tests.txt
          exit ${PIPESTATUS[0]}

      - name: Licence check with store-release rules
        id: licences
        continue-on-error: true
        run: |
          python tools/check_licenses.py --release 2>&1 | tee ci-results/licences-release.txt
          exit ${PIPESTATUS[0]}

      - name: Baseline model timings in this browser (not accuracy)
        continue-on-error: true
        run: node tools/baseline/run.mjs --timings ci-results/baseline-timings.json

      - name: Build with the local server enabled (for the browser checks)
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read the SLT dictionary list (GitHub API limit)
        run: npm run build

      - name: ASL mode in a real browser, compared with the server; the model must run in the worker
        id: asl
        continue-on-error: true
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > ci-results/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
          cd web
          SELFTEST_API=http://127.0.0.1:8000 SELFTEST_REQUIRE_WORKER=1 SELFTEST_OUT=../ci-results/asl-selftest.json node tests/asl-selftest-run.mjs

      - name: Build the website as GitHub Pages serves it (no server)
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read the SLT dictionary list (GitHub API limit)
          VITE_API_BASE: none
        run: npm run build

      - name: PSL bundle in a real browser (Stage 2 gate, web part)
        id: psl
        continue-on-error: true
        run: node tools/psl_browser/run.mjs | tee ci-results/psl-browser.txt

      - name: Lighthouse on the Pages build (measured on GitHub's computer, simulated throttling)
        id: lighthouse
        continue-on-error: true
        run: |
          # python's server does not compress (GitHub Pages does), so "text compression" findings here are not real.
          # (serve@14 was tried; Lighthouse then reported NO_LCP.)
          python -m http.server 4173 --directory web/dist > ci-results/lighthouse-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break; sleep 2; done  # wait until it answers
          export CHROME_PATH="$(cd web && node -e "console.log(require('playwright').chromium.executablePath())")"
          # Both pages: the project page (/) and the app (/app.html). Budgets (docs/WEBSITE.md): mobile performance
          # >= 90, accessibility 100, best practices >= 95, SEO 100.
          for page in "" "app.html"; do
            for preset in desktop mobile; do
              extra=""; [ "$preset" = desktop ] && extra="--preset=desktop"
              name="$preset"; [ -n "$page" ] && name="app-$preset"
              npx --yes lighthouse@12 "http://127.0.0.1:4173/$page" $extra --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="ci-results/lighthouse-$name.json" --chrome-flags="--headless=new --no-sandbox" --quiet
            done
          done
          python - <<'PY'
          import json
          out = {}
          for preset in ("desktop", "mobile", "app-desktop", "app-mobile"):
              d = json.load(open(f"ci-results/lighthouse-{preset}.json"))
              out[preset] = {k: (None if v["score"] is None else round(v["score"] * 100)) for k, v in d["categories"].items()}
              lcp = d["audits"]["largest-contentful-paint"].get("numericValue")
              out[preset]["lcp_ms"] = None if lcp is None else round(lcp)
              out[preset]["fcp_ms"] = round(d["audits"]["first-contentful-paint"].get("numericValue") or -1)
              out[preset]["runtime_error"] = (d.get("runtimeError") or {}).get("code")
              out[preset]["lcp_error"] = d["audits"]["largest-contentful-paint"].get("errorMessage")
              out[preset]["lighthouse"] = d["lighthouseVersion"]
              failing = []
              for cat in ("accessibility", "best-practices", "seo"):
                  for ref in d["categories"][cat]["auditRefs"]:
                      audit = d["audits"][ref["id"]]
                      if ref.get("weight", 0) > 0 and audit.get("score") is not None and audit["score"] < 1:
                          items = [str(i.get("node", {}).get("snippet") or i.get("url") or i.get("description") or "")[:120] for i in (audit.get("details") or {}).get("items", [])[:3]]
                          failing.append(f"{cat}: {ref['id']} ({audit['title']}) {items}")
              opportunities = sorted((a for a in d["audits"].values() if (a.get("details") or {}).get("type") == "opportunity" and (a.get("numericValue") or 0) > 100),
                                     key=lambda a: -a["numericValue"])[:5]
              out[preset]["failing"] = failing
              out[preset]["opportunities"] = [f"{a['id']}: {round(a['numericValue'])} ms" for a in opportunities]
          json.dump(out, open("ci-results/lighthouse-summary.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY

      - name: Build the offline shared copy (npm run build:shared)
        id: shared
        continue-on-error: true
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read the SLT dictionary list (GitHub API limit)
        run: npm run build:shared

      - name: Summary
        if: always()
        run: |
          {
            echo "## SignBridge preview: ${GITHUB_SHA::7}"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| All test suites (incl. Inference Baseline v1 in Chromium) | ${{ steps.tests.outcome }} |"
            echo "| Licence check, store-release rules | ${{ steps.licences.outcome }} |"
            echo "| ASL in the browser: worker, and same answers as the server | ${{ steps.asl.outcome }} |"
            echo "| PSL bundle in the browser: same top-1 as Python | ${{ steps.psl.outcome }} |"
            echo "| Lighthouse measured | ${{ steps.lighthouse.outcome }} |"
            echo "| Offline shared copy built | ${{ steps.shared.outcome }} |"
            [ -f ci-results/psl-browser.txt ] && { echo ""; echo '```'; cat ci-results/psl-browser.txt; echo '```'; }
            [ -f ci-results/lighthouse-summary.json ] && { echo ""; echo '```'; cat ci-results/lighthouse-summary.json; echo '```'; }
            echo ""
            echo "Download the preview site and the shared copy from **Artifacts** below."
            if [ -f ci-results/asl-selftest.json ]; then
              echo ""
              echo '```'
              python -c "import json; d=json.load(open('ci-results/asl-selftest.json')); s=d.get('selftest',{}); print('thread:', s.get('browser',{}).get('thread'), '| worker error:', s.get('browserWorkerError')); [print('sign', x['seed'], 'len', x['length'], 'browser ms', x.get('browser',{}).get('medianMs'), 'top1', x.get('browser',{}).get('top1')) for x in s.get('signs',[])]"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-results
          path: ci-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: web/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.shared.outcome == 'success'
        with:
          name: shared-copy
          path: web/dist-shared/SignMate-shared-copy.zip
          if-no-files-found: error

      - name: Fail the run if a required check failed
        if: steps.tests.outcome != 'success' || steps.asl.outcome != 'success' || steps.shared.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} asl=${{ steps.asl.outcome }} shared=${{ steps.shared.outcome }}"
          exit 1
