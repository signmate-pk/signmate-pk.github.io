<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b1c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="canonical" href="https://signmate-pk.github.io/app.html" />
    <meta name="description" content="The SignMate app: sign in Pakistan Sign Language, confirm the word, and it speaks in Urdu or English. Runs on your device; camera video never leaves it." />
    <meta property="og:title" content="SignMate app: Pakistan Sign Language to Urdu and English" />
    <meta property="og:description" content="Sign in PSL and it speaks in Urdu or English, after you confirm. Runs in your browser; your camera video never leaves your device." />
    <meta property="og:url" content="https://signmate-pk.github.io/app.html" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://signmate-pk.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <title>SignMate app — Pakistan Sign Language to Urdu and English</title>
    <style>
      /* First paint before the app script runs: the same colours and layout as the app, so nothing jumps. */
      body{margin:0;background:#f5f4fb;color:#16142c;font:16px/1.55 Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      @media (prefers-color-scheme:dark){body{background:#0d0b1c;color:#f3f1ff}}
      .boot{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
      .boot header{display:flex;align-items:center;gap:10px;padding:12px 16px}
      .boot img{width:34px;height:34px;border-radius:10px}
      .boot main{padding:14px}
      .boot .stage{height:min(62vh,620px);min-height:300px;border-radius:26px;background:radial-gradient(120% 80% at 50% 0%,#2a2260,#151233 45%,#0f0d22);display:grid;place-items:center;color:#f6f4ff;text-align:center;padding:20px}
      .boot h1{font-size:24px;margin:0;letter-spacing:-.02em}
      .boot a{color:inherit}
      .nojs{max-width:40rem;margin:0 auto;padding:20px 16px 40px}
      .nojs h2{font-size:20px;margin:0 0 8px}
      .nojs a{color:#4f46e5;font-weight:700}
      @media (prefers-color-scheme:dark){.nojs a{color:#3ddc97}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><header><img src="./icon.svg" alt="" width="34" height="34" /><strong>SignMate</strong></header><main><div class="stage"><div><h1>Talk face to face.</h1><p>Pakistan Sign Language to Urdu and English, on this device.</p></div></div></main></div>
    </div>
    <noscript>
      <div class="nojs">
        <h2>The live translator needs JavaScript</h2>
        <p>SignMate reads Pakistan Sign Language from your camera and speaks it in Urdu or English. All of that happens in your browser, so this page needs JavaScript. Your camera video never leaves your device.</p>
        <p><strong>To turn JavaScript on:</strong> in Chrome or Edge, open Settings → Privacy and security → Site settings → JavaScript and allow it for this site. In Safari on iPhone, open Settings → Apps → Safari → Advanced and switch on JavaScript. Then reload this page.</p>
        <p>Without JavaScript you can still read everything about SignMate, including the full sign list, results and limitations, on the <a href="./">project page</a>, and see <a href="./#how">how it works, with screenshots</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
