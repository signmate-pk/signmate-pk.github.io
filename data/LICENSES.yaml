# SignMate licence ledger (CLAUDE.md section 4).
#
# Every dataset, model weight file, reference-clip collection, font and own-data collection the
# project uses or has evaluated has one entry here. tools/check_licenses.py validates this file
# against data/licenses.schema.json and fails when a file in models/, data/, web/public/models/ or
# web/public/clips/ is not covered by an entry that allows its use.
# Code that trains on or ships an asset calls data_engine.ledger.assert_allowed(asset_id, use).
#
# Uses (allowed_uses):
#   pretrain_encoder      train a motion encoder on it, no labels carried over
#   train_labels          train a classifier on its labels
#   evaluate              measure accuracy on it; nothing from it is shipped
#   reference_clip        show its clips to users
#   redistribute_weights  ship model weights (its own, or weights trained on it)
#   redistribute_data     ship or re-publish its files
#
# status: cleared | cleared_with_conditions | permission_needed | blocked | not_available | unverified | retired
# Only cleared / cleared_with_conditions entries may have files in the repository.
# retired: no longer used (master v4 retired every PSL entry, CLAUDE.md 10.1); the entry is kept as a record,
#   with its former status and uses under `retired`. It allows nothing and covers no file.
# label_scope asl_mode_only: ASL labels; since master v4 ASL is SignMate's only language (CLAUDE.md 10.1).
#
# All entries below were checked on 2026-11-18 by the agent from the public pages named in
# licence_evidence. Facts marked "third-party" come from a catalogue, not the publisher, and must be
# re-checked when the data is downloaded. Sizes are bytes unless a unit is given.

